<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>Claude RTL Fix</title>
  <style>
    body {
      font-family: Tahoma, "Segoe UI", sans-serif;
      width: 260px;
      padding: 16px;
      background: #1a1a1a;
      color: #f0f0f0;
      direction: rtl;
      text-align: right;
    }
    h1 {
      font-size: 15px;
      margin: 0 0 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    p {
      font-size: 13px;
      line-height: 1.7;
      color: #cfcfcf;
      margin: 0 0 10px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6ee7a0;
      background: #16241c;
      border-radius: 6px;
      padding: 8px 10px;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6ee7a0;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <h1>🩹 اصلاح متن فارسی هوش مصنوعی</h1>
  <p>این افزونه به‌صورت خودکار جهت متن‌های فارسی/عربی مخلوط با کلمات انگلیسی رو در Claude، ChatGPT، Gemini و NotebookLM اصلاح می‌کنه.</p>
  <div class="status">
    <span class="dot"></span>
    <span>فعال روی این سایت</span>
  </div>
</body>
</html>
